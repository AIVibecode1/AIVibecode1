<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" fill="none" role="img" aria-label="Mohamed — Engineer, Researcher, Building with AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a0d12"/>
    </linearGradient>
    <radialGradient id="glowIndigo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(860 30) scale(360)">
      <stop stop-color="#6366f1" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(60 320) scale(420)">
      <stop stop-color="#0891b2" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="620" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#c7d2fe"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="120" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#171c24" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="300" fill="url(#bg)"/>
  <rect width="1000" height="300" fill="url(#grid)" opacity="0.55"/>
  <rect width="1000" height="300" fill="url(#glowIndigo)"/>
  <rect width="1000" height="300" fill="url(#glowCyan)"/>
  <rect x="0" y="297" width="1000" height="3" fill="url(#accentLine)" opacity="0.9"/>

  <!-- Left: typographic -->
  <text x="64" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="7" fill="#818cf8">HI, I'M</text>
  <text x="62" y="164" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="66" font-weight="800" fill="url(#nameGrad)">Mohamed</text>
  <rect x="64" y="188" width="56" height="3" rx="1.5" fill="url(#accentLine)"/>
  <text x="64" y="224" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#e6edf3">Engineer · Researcher · Building with AI</text>
  <text x="64" y="254" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-style="italic" fill="#8b949e">Questioning everything</text>

  <!-- Right: link chips -->
  <g font-family="Cascadia Code, Fira Code, Consolas, monospace" font-size="14" fill="#c9d1d9">
    <rect x="640" y="92" width="296" height="40" rx="20" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="788" y="117" text-anchor="middle">X  ·  @AIVibecode</text>

    <rect x="640" y="144" width="296" height="40" rx="20" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="788" y="169" text-anchor="middle" fill="#67e8f9">blog.q4bits.com</text>

    <rect x="640" y="196" width="296" height="40" rx="20" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="788" y="221" text-anchor="middle" fill="#67e8f9">news.q4bits.com</text>
  </g>
</svg>
